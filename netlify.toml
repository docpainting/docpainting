# DOC Painting AI Chat System Configuration
[build]
  functions = "netlify/functions"
  publish = "."
  
[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "rag-system/"
  
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["neo4j-driver", "@langchain/openai", "@langchain/community", "uuid", "winston", "zod", "nodemailer", "dotenv"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
